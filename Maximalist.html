<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Maximalist Business Card</title>
  <!-- Font Awesome Icons (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Font (Playfair Display for ornate + Inter for readability) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800;1,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0808;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
      margin: 0;
      gap: 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* ornate background pattern */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(200, 150, 50, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(200, 50, 100, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(100, 50, 200, 0.04) 0%, transparent 50%),
        repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(200, 180, 150, 0.02) 20px, rgba(200, 180, 150, 0.02) 21px),
        repeating-linear-gradient(-45deg, transparent, transparent 20px, rgba(200, 180, 150, 0.02) 20px, rgba(200, 180, 150, 0.02) 21px);
      pointer-events: none;
      z-index: 0;
    }

    /* Navigation arrows - maximalist style */
    .nav-arrow {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a1210, #2d1f1a);
      border: 2px solid #c9a84c;
      color: #c9a84c;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
      box-shadow: 
        0 0 30px rgba(201, 168, 76, 0.1),
        inset 0 0 30px rgba(201, 168, 76, 0.05),
        0 4px 0 #8a6a2a;
      text-decoration: none;
      flex-shrink: 0;
      z-index: 2;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      letter-spacing: 0.5px;
      gap: 6px;
      font-size: 0.6rem;
      text-transform: uppercase;
      color: #c9a84c;
      position: relative;
      overflow: hidden;
    }

    .nav-arrow::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #c9a84c22, #ff6b3522, #c9a84c22, #ff6b3522, #c9a84c22);
      animation: spinGlow 6s linear infinite;
      z-index: -1;
    }

    @keyframes spinGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .nav-arrow i {
      font-size: 1rem;
      color: #c9a84c;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .nav-arrow span {
      position: relative;
      z-index: 1;
    }

    .nav-arrow:hover {
      background: linear-gradient(135deg, #2d1f1a, #1a1210);
      border-color: #ff6b35;
      box-shadow: 
        0 0 50px rgba(201, 168, 76, 0.2),
        inset 0 0 40px rgba(255, 107, 53, 0.05),
        0 4px 0 #8a6a2a;
      transform: scale(1.05) translateY(-2px);
      color: #ff6b35;
    }

    .nav-arrow:hover i {
      color: #ff6b35;
      text-shadow: 0 0 30px rgba(255, 107, 53, 0.3);
    }

    .nav-arrow:active {
      transform: scale(0.92);
    }

    /* main card – maximalist style */
    .card {
      max-width: 460px;
      width: 100%;
      background: linear-gradient(145deg, #1a1210, #0d0a08);
      border-radius: 2rem;
      padding: 2.5rem 2rem 2.8rem;
      position: relative;
      z-index: 1;
      border: 3px solid #c9a84c;
      box-shadow: 
        0 0 60px rgba(201, 168, 76, 0.08),
        0 0 120px rgba(201, 168, 76, 0.04),
        inset 0 0 80px rgba(201, 168, 76, 0.03),
        0 8px 0 #8a6a2a,
        0 12px 40px rgba(0, 0, 0, 0.6);
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
      animation: fadeMaximalist 1.2s ease-out forwards;
      opacity: 0;
      overflow: visible;
    }

    @keyframes fadeMaximalist {
      0% { 
        opacity: 0; 
        transform: translateY(30px) scale(0.95);
        filter: blur(4px);
      }
      60% {
        filter: blur(1px);
        transform: translateY(-4px) scale(1.01);
      }
      100% { 
        opacity: 1; 
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* ornate border layers */
    .card::before {
      content: '';
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      border-radius: 2.2rem;
      background: conic-gradient(from 0deg, 
        #c9a84c, #ff6b35, #c9a84c, #ff6b35, #c9a84c, #ff6b35, #c9a84c);
      background-size: 400% 400%;
      z-index: -1;
      animation: rainbowBorder 8s ease-in-out infinite;
      filter: blur(0px);
      opacity: 0.7;
    }

    .card::after {
      content: '';
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 1.4rem;
      pointer-events: none;
      z-index: 0;
      box-shadow: inset 0 0 60px rgba(201, 168, 76, 0.03);
    }

    @keyframes rainbowBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 0 80px rgba(201, 168, 76, 0.12),
        0 0 160px rgba(201, 168, 76, 0.06),
        inset 0 0 80px rgba(201, 168, 76, 0.05),
        0 8px 0 #8a6a2a,
        0 16px 50px rgba(0, 0, 0, 0.7);
    }

    /* avatar – maximalist frame */
    .avatar {
      display: flex;
      justify-content: center;
      margin-bottom: 1.4rem;
      position: relative;
      z-index: 1;
    }

    .avatar-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 0 0 4px #c9a84c,
        0 0 0 8px rgba(201, 168, 76, 0.2),
        0 0 0 12px rgba(201, 168, 76, 0.08),
        0 0 60px rgba(201, 168, 76, 0.15),
        inset 0 0 40px rgba(201, 168, 76, 0.05);
      border: 2px solid #ff6b35;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1210, #2d1f1a);
      position: relative;
      transition: all 0.5s ease;
    }

    .avatar-circle::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, 
        transparent, rgba(201, 168, 76, 0.15), 
        transparent, rgba(255, 107, 53, 0.15), 
        transparent, rgba(201, 168, 76, 0.15), 
        transparent);
      animation: spinGlow 10s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
      filter: sepia(0.2) contrast(1.1) brightness(0.9);
      loading: lazy;
    }

    .avatar-circle i {
      display: none;
      position: relative;
      z-index: 1;
      font-size: 5rem;
      color: #c9a84c;
      opacity: 0.3;
    }

    .avatar-circle img:not([src]), 
    .avatar-circle img[src=""] {
      display: none;
    }
    .avatar-circle img:not([src]) + i,
    .avatar-circle img[src=""] + i {
      display: inline-block;
    }

    /* name & title – maximalist */
    .name-title {
      text-align: center;
      margin-bottom: 1.6rem;
      position: relative;
      z-index: 1;
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 900;
      font-style: italic;
      background: linear-gradient(135deg, #c9a84c, #ff6b35, #c9a84c);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientText 5s ease-in-out infinite;
      letter-spacing: 1px;
      text-shadow: 0 0 40px rgba(201, 168, 76, 0.1);
      margin-bottom: 0.2rem;
    }

    @keyframes gradientText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .name::after {
      content: '✦ ✦ ✦';
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 0.7rem;
      font-style: normal;
      -webkit-text-fill-color: #c9a84c;
      color: #c9a84c;
      letter-spacing: 8px;
      margin: 0.6rem auto 0;
      opacity: 0.4;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 400;
      font-style: italic;
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
      display: inline-block;
      padding: 0.3rem 2rem;
      border-radius: 30px;
      letter-spacing: 1.5px;
      border: 1px solid rgba(201, 168, 76, 0.15);
      backdrop-filter: blur(2px);
      box-shadow: inset 0 0 30px rgba(201, 168, 76, 0.03);
    }

    .title i {
      margin-right: 8px;
      opacity: 0.7;
      color: #ff6b35;
      -webkit-text-fill-color: #ff6b35;
    }

    /* divider – maximalist ornate */
    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a84c, #ff6b35, #c9a84c, transparent);
      margin: 1.2rem 0 1.6rem;
      opacity: 0.5;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 0 30px rgba(201, 168, 76, 0.1);
    }

    .divider::after {
      content: '◆ ◇ ◆';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #c9a84c;
      font-size: 0.7rem;
      background: #1a1210;
      padding: 0 14px;
      letter-spacing: 4px;
      opacity: 0.6;
      text-shadow: 0 0 20px rgba(201, 168, 76, 0.2);
    }

    /* contact list – maximalist */
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 0.8rem 0.6rem 0.5rem;
      border-radius: 60px;
      background: rgba(201, 168, 76, 0.03);
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
      border: 1px solid rgba(201, 168, 76, 0.06);
      text-decoration: none;
      color: #d4c4a0;
      position: relative;
      overflow: hidden;
    }

    .contact-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.04), transparent);
      transition: left 0.8s ease;
    }

    .contact-item:hover::before {
      left: 100%;
    }

    .contact-item:hover {
      background: rgba(201, 168, 76, 0.06);
      border-color: rgba(201, 168, 76, 0.2);
      box-shadow: 0 0 40px rgba(201, 168, 76, 0.04), inset 0 0 40px rgba(201, 168, 76, 0.02);
      transform: translateX(6px);
    }

    .contact-icon {
      width: 46px;
      height: 46px;
      background: rgba(201, 168, 76, 0.06);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #c9a84c;
      flex-shrink: 0;
      border: 1px solid rgba(201, 168, 76, 0.08);
      transition: all 0.5s ease;
      box-shadow: 0 0 20px rgba(201, 168, 76, 0.03);
    }

    .contact-item:hover .contact-icon {
      background: rgba(201, 168, 76, 0.1);
      border-color: rgba(201, 168, 76, 0.2);
      box-shadow: 0 0 30px rgba(201, 168, 76, 0.06);
      color: #ff6b35;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .contact-label {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8a7a5a;
      opacity: 0.7;
      font-family: 'Inter', sans-serif;
    }

    .contact-value {
      font-size: 0.95rem;
      font-weight: 500;
      color: #d4c4a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Inter', sans-serif;
    }

    .contact-item .fa-chevron-right {
      color: #c9a84c !important;
      opacity: 0.2 !important;
      transition: all 0.4s ease;
      font-size: 0.7rem;
    }

    .contact-item:hover .fa-chevron-right {
      opacity: 0.8 !important;
      transform: translateX(6px);
      color: #ff6b35 !important;
    }

    /* action buttons – maximalist */
    .actions {
      display: flex;
      justify-content: center;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin: 0.5rem 0 0.4rem;
      position: relative;
      z-index: 1;
    }

    .action-btn {
      background: rgba(201, 168, 76, 0.04);
      border: 1px solid rgba(201, 168, 76, 0.08);
      border-radius: 60px;
      padding: 0.7rem 1.2rem;
      font-weight: 600;
      font-size: 0.8rem;
      color: #c9a84c;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
      cursor: pointer;
      text-decoration: none;
      flex: 1 0 auto;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
    }

    .action-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.04), transparent);
      transition: left 0.6s ease;
    }

    .action-btn:hover::before {
      left: 100%;
    }

    .action-btn i {
      font-size: 1rem;
      color: #c9a84c;
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      background: rgba(201, 168, 76, 0.08);
      border-color: rgba(201, 168, 76, 0.2);
      box-shadow: 0 0 40px rgba(201, 168, 76, 0.05);
      transform: scale(1.03);
      color: #ff6b35;
    }

    .action-btn:hover i {
      color: #ff6b35;
      text-shadow: 0 0 30px rgba(255, 107, 53, 0.2);
    }

    /* WhatsApp button – full width, maximalist */
    .action-btn.whatsapp-btn {
      flex: 1 1 100%;
      background: rgba(37, 211, 102, 0.04);
      border-color: rgba(37, 211, 102, 0.1);
      color: #7ddfa0;
      margin-top: 0.2rem;
    }

    .action-btn.whatsapp-btn i {
      color: #25d366;
    }

    .action-btn.whatsapp-btn:hover {
      background: rgba(37, 211, 102, 0.08);
      border-color: rgba(37, 211, 102, 0.2);
      box-shadow: 0 0 50px rgba(37, 211, 102, 0.05);
      color: #25d366;
    }

    .action-btn.whatsapp-btn:hover i {
      color: #25d366;
      text-shadow: 0 0 30px rgba(37, 211, 102, 0.2);
    }

    /* decorative corner flourishes */
    .card .corner {
      position: absolute;
      font-size: 1.2rem;
      color: #c9a84c;
      opacity: 0.15;
      font-family: 'Playfair Display', serif;
      z-index: 0;
      pointer-events: none;
    }

    .corner.tl { top: 16px; left: 20px; }
    .corner.tr { top: 16px; right: 20px; }
    .corner.bl { bottom: 16px; left: 20px; }
    .corner.br { bottom: 16px; right: 20px; }

    /* responsive */
    @media (max-width: 520px) {
      body {
        gap: 0.6rem;
        padding: 1rem;
      }
      .nav-arrow {
        width: 48px;
        height: 48px;
        min-width: 48px;
        font-size: 0.5rem;
      }
      .nav-arrow i {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 440px) {
      body {
        gap: 0.4rem;
        padding: 0.8rem;
      }
      .card {
        padding: 1.8rem 1.2rem 2rem;
        border-radius: 1.4rem;
      }
      .card::before {
        border-radius: 1.8rem;
      }
      .name {
        font-size: 1.8rem;
      }
      .avatar-circle {
        width: 100px;
        height: 100px;
      }
      .contact-item {
        padding: 0.4rem 0.6rem 0.4rem 0.4rem;
      }
      .contact-icon {
        width: 38px;
        height: 38px;
        font-size: 1rem;
      }
      .action-btn {
        padding: 0.5rem 0.7rem;
        font-size: 0.65rem;
        flex: 1 1 40%;
        gap: 5px;
        min-width: 55px;
      }
      .action-btn.whatsapp-btn {
        flex: 1 1 100%;
      }
      .nav-arrow {
        width: 38px;
        height: 38px;
        min-width: 38px;
        font-size: 0.4rem;
      }
      .nav-arrow i {
        font-size: 0.65rem;
      }
      .corner { display: none; }
    }

    @media (max-width: 360px) {
      body {
        flex-direction: column;
        gap: 0.8rem;
        padding: 1rem;
      }
      .nav-arrow {
        width: 48px;
        height: 48px;
        min-width: 48px;
        font-size: 0.5rem;
        transform: rotate(90deg);
      }
      .nav-arrow:hover {
        transform: rotate(90deg) scale(1.05);
      }
      .nav-arrow:active {
        transform: rotate(90deg) scale(0.92);
      }
      .nav-arrow i {
        font-size: 0.7rem;
      }
      .actions {
        flex-direction: column;
        align-items: stretch;
      }
      .action-btn {
        flex: 1 1 auto;
      }
      .action-btn.whatsapp-btn {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
